[package]
name = "dhappa-v3"
version = "5.0.0"
description = "DHAPPA V3 high-performance analytics shell"
edition = "2021"

[lib]
name = "dhappa_v3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
